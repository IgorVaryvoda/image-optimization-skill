name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate skill structure, frontmatter, and links
        run: node scripts/validate-skills.mjs

      - name: Test image audit script
        run: node scripts/test-audit-images.mjs
